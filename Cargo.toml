[package]
name = "hh-ball-plate"
version = "0.1.0"
edition = "2024"

[dependencies]
nokhwa = { version = "0.10.10", features = ["input-native"]}
opencv = { version = "0.98.1", default-features = false, features = ["clang-runtime", "imgproc", 'imgcodecs'] }
easy_color = "0.1.13"
dotenvy = "0.15.0"
winit = { version = "0.30.13", default-features = false, features = ["wayland", "wayland-dlopen", "rwh_06"] }
softbuffer = "0.4.8"
tokio = { version = "1.52.3", features = ["sync", "rt", "rt-multi-thread", "macros"] }
serialport = "4.9.0"
cprint = { version = "1.0.0", features = ["cprint", "ceprint"]}
crossbeam-channel = "0.5.15"
pid = { path = "pid"}
ctrlc = "3.5.2"


[features]
arduino-less = []
no-graph = []

[workspace]
resolver = "3"
members = ["physics","pid"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.1"
physics = { path = "physics"}

[[bench]]
name = "pid_benchmarks"
harness = false

[[bench]]
name = "pid_params_benchmark"
harness = false
